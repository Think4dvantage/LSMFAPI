[tool.poetry]
name = "lsmfapi"
version = "0.3.39"
description = "Lenticularis SwissMeteo Forecast API"
authors = ["Raphael Eymann <r+claude@eymanns.ch>"]
packages = [{include = "lsmfapi", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.9"
httpx = "^0.27"
apscheduler = "^3.10"
sqlalchemy = "^2.0"
eccodes = "^2.38"
# The Linux eccodes wheel depends on eccodeslib (the C library) but the Windows
# wheels of the same release do not. Poetry locks from whichever file matches the
# host, so locking on Windows would silently drop it. Declared explicitly to keep
# the lock correct no matter where it is generated.
eccodeslib = {version = "^2.47", markers = "platform_system != 'Windows'"}
eccodes-cosmo-resources-python = "^2.38"
scipy = "^1.14"
numpy = ">=1.26,<3"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that hit real external APIs (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
