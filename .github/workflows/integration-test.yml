name: Integration test — CH1 collection

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint (ruff check only — no reformat)
        run: poetry run ruff check .

      - name: Check poetry.lock is in sync with pyproject.toml
        run: poetry check --lock

      - name: Run unit tests (no network, seconds not minutes)
        run: poetry run pytest -m "not integration" -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "poetry"

      # No system/conda libeccodes: on Linux the eccodes wheel depends on
      # eccodeslib, which ships the matching C library, and findlibs resolves an
      # installed package ahead of LD_LIBRARY_PATH and system paths.
      - name: Install dependencies
        run: poetry install --with dev

      - name: Run integration test
        run: poetry run pytest -m integration -v --tb=short
