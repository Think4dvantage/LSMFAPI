name: Build & publish Docker image

on:
  push:
    tags:
      - "v*"
  # Manual re-run button. Needed because a tag push is sometimes never delivered as an
  # Actions event (e.g. v0.3.42's tag push during a GitHub platform outage never triggered
  # a run at all, with no automatic retry) — dispatch against the missed tag via the UI's
  # ref picker or `gh workflow run docker-publish.yml --ref v0.3.42` to redo it.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # push.branches never matches a tag ref, so integration-test.yml does not run for a
  # tag push — without this job, a red integration test never blocked a release.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run integration test
        run: poetry run pytest -m integration -v --tb=short

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For a tag v0.2.0 this produces:
      #   ghcr.io/owner/lsmfapi:v0.2.0
      #   ghcr.io/owner/lsmfapi:0.2.0
      #   ghcr.io/owner/lsmfapi:0.2
      #   ghcr.io/owner/lsmfapi:0
      #   ghcr.io/owner/lsmfapi:latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # amd64 only — no evidence arm64 is deployed anywhere, and emulated arm64 builds
      # of numpy/scipy/eccodes under QEMU are very slow. Confirmed with the user.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
