services:
  lsmfapi:
    image: ghcr.io/think4dvantage/lsmfapi:latest
    restart: unless-stopped
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
      - ./grib-cache:/tmp/lsmfapi_grib
    # Healthcheck lives in the Dockerfile — no need to duplicate/keep it in sync here.
    networks:
      - proxy

networks:
  proxy:
    external: true
